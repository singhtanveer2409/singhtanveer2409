<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Tanveer Singh - MCA student and aspiring ML engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .name { font: 700 44px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .hello { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 3px; }
      .role { font: 600 24px 'Courier New', Consolas, monospace; fill: url(#accent); opacity: 0; animation: cycle 12s infinite; }
      .r2 { animation-delay: 3s; }
      .r3 { animation-delay: 6s; }
      .r4 { animation-delay: 9s; }
      .cursor { fill: #38bdf8; animation: blink 1s steps(1) infinite; }
      .orb1 { animation: float 7s ease-in-out infinite; }
      .orb2 { animation: float 9s ease-in-out infinite reverse; }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(10px); }
        3%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        25%  { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; }
      }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
    </style>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <circle class="orb1" cx="790" cy="60" r="70" fill="#38bdf8" opacity="0.10"/>
  <circle class="orb2" cx="700" cy="170" r="46" fill="#a78bfa" opacity="0.12"/>

  <text class="hello" x="48" y="62">HEY, I'M</text>
  <text class="name" x="48" y="112">Tanveer Singh</text>

  <g transform="translate(48 160)">
    <text class="role" x="0" y="0">MCA Student @ MIT-WPU, Pune</text>
    <text class="role r2" x="0" y="0">Aspiring ML Engineer</text>
    <text class="role r3" x="0" y="0">Python · Machine Learning · Data</text>
    <text class="role r4" x="0" y="0">Industry-ready, not tutorial-ready</text>
    <rect class="cursor" x="470" y="-22" width="3" height="28"/>
  </g>
</svg>
